name: GruzSher Preview - Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'redesign/gruzsher-premium-v3', 'redesign/gruzsher-v3-1-structural', 'redesign/gruzsher-v3-2-layout-fixes', 'fix/gruzsher-v3-3-booking-training-ux']
    paths:
      - 'android/**'
      - 'backend/**'

permissions:
  contents: read

jobs:
  backend-tests:
    name: Server regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run API tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests

  android-preview:
    name: Android unit tests and debug APK
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble Android preview APK (offline demo)
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists and calculate checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload Android APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: GruzSher-KBR-v2.3-preview-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
